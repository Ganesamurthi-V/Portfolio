<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Smart Career Guide resume match report">
  <defs>
    <style>
      .h{font-family:'Segoe UI',Inter,system-ui,sans-serif;font-weight:600}
