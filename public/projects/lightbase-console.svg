<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="LightBase console table editor">
  <defs>
    <style>
      .h{font-family:'Segoe UI',Inter,system-ui,sans-serif;font-weight:600}
      .b{font-family:'Segoe UI',Inter,system-ui,sans-serif;font-weight:400}
      .m{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-weight:500}
      .fg{fill:#eef0f2}.mut{fill:#8d93a0}.dim{fill:#5f6674}.acc{fill:#7de2d1}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#07080a"/>

  <!-- ===== Sidebar ===== -->
  <rect x="0" y="0" width="268" height="1000" fill="#0b0d11"/>
  <line x1="268" y1="0" x2="268" y2="1000" stroke="#ffffff" stroke-opacity="0.07"/>

  <rect x="28" y="28" width="32" height="32" rx="9" fill="#7de2d1"/>
  <path d="M38 50l6-14 6 14" stroke="#06231f" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h fg" x="70" y="43" font-size="16">LightBase</text>
  <text class="m dim" x="70" y="57" font-size="8.5" letter-spacing="1.6">SELF-HOSTED</text>

  <!-- project switcher -->
  <rect x="20" y="86" width="228" height="40" rx="10" fill="#171b22"/>
  <circle cx="40" cy="106" r="5" fill="#7de2d1"/>
  <text class="b fg" x="56" y="103" font-size="12.5">local · postgres</text>
  <text class="m dim" x="56" y="117" font-size="9">:5432 / app</text>
  <path d="M230 102l5 5 5-5" stroke="#8d93a0" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <text class="m dim" x="28" y="164" font-size="9" letter-spacing="2">EXPLORER</text>

  <g class="b">
    <!-- tables group -->
    <path d="M34 182l5 5 5-5" stroke="#8d93a0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text class="fg" x="56" y="186" font-size="12.5">public</text>
    <text class="m dim" x="222" y="186" font-size="9">6</text>

    <rect x="20" y="200" width="228" height="30" rx="8" fill="#7de2d1" fill-opacity="0.12"/>
    <rect x="20" y="206" width="2.5" height="18" rx="1.25" fill="#7de2d1"/>
    <text class="m acc" x="62" y="220" font-size="11.5">users</text>
    <text class="m dim" x="214" y="220" font-size="9">128</text>

    <text class="m mut" x="62" y="252" font-size="11.5">sessions</text><text class="m dim" x="214" y="252" font-size="9">341</text>
    <text class="m mut" x="62" y="282" font-size="11.5">projects</text><text class="m dim" x="218" y="282" font-size="9">12</text>
    <text class="m mut" x="62" y="312" font-size="11.5">api_keys</text><text class="m dim" x="222" y="312" font-size="9">8</text>
    <text class="m mut" x="62" y="342" font-size="11.5">audit_log</text><text class="m dim" x="206" y="342" font-size="9">2.4k</text>
    <text class="m mut" x="62" y="372" font-size="11.5">migrations</text><text class="m dim" x="218" y="372" font-size="9">31</text>
  </g>

  <text class="m dim" x="28" y="424" font-size="9" letter-spacing="2">PLATFORM</text>
  <g class="b mut" font-size="12.5">
    <text x="56" y="452">Auth providers</text>
    <text x="56" y="484">API keys</text>
    <text x="56" y="516">Policies</text>
    <text x="56" y="548">SQL editor</text>
    <text x="56" y="580">Logs</text>
    <text x="56" y="612">Migrations</text>
  </g>

  <rect x="20" y="900" width="228" height="72" rx="12" fill="#12151b" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="40" cy="924" r="4" fill="#c8ff4d"/>
  <text class="m fg" x="54" y="928" font-size="10">3 services healthy</text>
  <text class="m dim" x="36" y="948" font-size="9">gateway · auth · rest</text>
  <text class="m dim" x="36" y="962" font-size="9">v0.6.2 · MIT</text>

  <!-- ===== Header ===== -->
  <g class="m dim" font-size="11">
    <text x="304" y="46">public</text><text x="352" y="46" fill="#3c424e">/</text>
  </g>
  <text class="h fg" x="366" y="47" font-size="20">users</text>
  <rect x="446" y="30" width="72" height="22" rx="6" fill="#7de2d1" fill-opacity="0.12"/>
  <text class="m acc" x="458" y="45" font-size="9.5">RLS ON</text>

  <rect x="1060" y="26" width="118" height="34" rx="17" fill="#12151b" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="b mut" x="1080" y="47" font-size="12">SQL editor</text>
  <rect x="1190" y="26" width="98" height="34" rx="17" fill="#12151b" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="b mut" x="1210" y="47" font-size="12">Policies</text>
  <rect x="1300" y="26" width="112" height="34" rx="17" fill="#12151b" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="b mut" x="1320" y="47" font-size="12">Insert row</text>
  <rect x="1424" y="26" width="140" height="34" rx="17" fill="#7de2d1"/>
  <text class="h" x="1446" y="47" font-size="12" fill="#06231f">Generate API</text>

  <line x1="268" y1="80" x2="1600" y2="80" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- filter bar -->
  <rect x="304" y="104" width="120" height="32" rx="8" fill="#12151b" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="m mut" x="320" y="124" font-size="10.5">+ filter</text>
  <rect x="436" y="104" width="120" height="32" rx="8" fill="#12151b" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="m mut" x="452" y="124" font-size="10.5">↑ sort</text>
  <rect x="568" y="104" width="150" height="32" rx="8" fill="#12151b" stroke="#ffffff" stroke-opacity="0.07"/>
