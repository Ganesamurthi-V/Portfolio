  <rect x="304" y="152" width="1260" height="492" rx="14" fill="#0d0f13" stroke="#ffffff" stroke-opacity="0.07"/>
  <rect x="304" y="152" width="1260" height="42" rx="14" fill="#171b22"/>
  <rect x="304" y="176" width="1260" height="18" fill="#171b22"/>

