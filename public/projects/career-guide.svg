  <text class="m" x="80" y="176" font-size="9.5" fill="#ff8079">PDF</text>
  <text class="m dim" x="132" y="152" font-size="9" letter-spacing="1.4">RESUME</text>
  <text class="h fg" x="132" y="174" font-size="14">ganesamurthi-v-resume.pdf</text>
