  <!-- ===== Generated endpoint panel ===== -->
  <rect x="304" y="672" width="756" height="284" rx="14" fill="#0d0f13" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="h fg" x="328" y="706" font-size="14">Generated endpoint</text>
  <rect x="984" y="690" width="52" height="24" rx="12" fill="#171b22"/>
  <text class="m dim" x="996" y="706" font-size="9.5">copy</text>

  <rect x="328" y="724" width="708" height="36" rx="8" fill="#12151b"/>
  <rect x="340" y="734" width="38" height="17" rx="4" fill="#7de2d1" fill-opacity="0.18"/>
  <text class="m acc" x="348" y="747" font-size="9.5">GET</text>
  <text class="m fg" x="390" y="747" font-size="11">/rest/v1/users?role=eq.admin&amp;order=created_at.desc&amp;limit=20</text>

  <text class="m dim" x="328" y="790" font-size="9.5" letter-spacing="1.4">RESPONSE · 200 OK · 11 ms</text>
  <rect x="328" y="802" width="708" height="130" rx="8" fill="#12151b"/>
  <g class="m" font-size="10.5">
    <text class="dim" x="344" y="824">[</text>
    <text class="dim" x="356" y="842">{</text>
    <text class="acc" x="372" y="860">"id"</text><text class="dim" x="404" y="860">:</text><text class="fg" x="414" y="860">"01H9Z…4kQ"</text><text class="dim" x="508" y="860">,</text>
    <text class="acc" x="520" y="860">"email"</text><text class="dim" x="572" y="860">:</text><text class="fg" x="582" y="860">"ada@lightbase.dev"</text><text class="dim" x="726" y="860">,</text>
    <text class="acc" x="372" y="878">"role"</text><text class="dim" x="416" y="878">:</text><text class="fg" x="426" y="878">"admin"</text><text class="dim" x="478" y="878">,</text>
    <text class="acc" x="490" y="878">"email_verified"</text><text class="dim" x="606" y="878">:</text><text x="616" y="878" fill="#c8ff4d">true</text>
    <text class="dim" x="356" y="896">}</text>
    <text class="dim" x="344" y="914">]</text>
  </g>

  <!-- ===== Policy panel ===== -->
  <rect x="1084" y="672" width="480" height="284" rx="14" fill="#0d0f13" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="h fg" x="1108" y="706" font-size="14">Exposure &amp; policies</text>

  <text class="m dim" x="1108" y="742" font-size="9" letter-spacing="1.4">PUBLIC COLUMNS</text>
  <g class="m" font-size="10.5">
    <rect x="1108" y="752" width="62" height="22" rx="6" fill="#7de2d1" fill-opacity="0.12"/><text class="acc" x="1120" y="767">id</text>
    <rect x="1178" y="752" width="76" height="22" rx="6" fill="#7de2d1" fill-opacity="0.12"/><text class="acc" x="1190" y="767">email</text>
    <rect x="1262" y="752" width="68" height="22" rx="6" fill="#7de2d1" fill-opacity="0.12"/><text class="acc" x="1274" y="767">role</text>
    <rect x="1338" y="752" width="110" height="22" rx="6" fill="#7de2d1" fill-opacity="0.12"/><text class="acc" x="1350" y="767">created_at</text>
  </g>

  <text class="m dim" x="1108" y="808" font-size="9" letter-spacing="1.4">WITHHELD</text>
  <g class="m" font-size="10.5">
    <rect x="1108" y="818" width="118" height="22" rx="6" fill="#1b2029"/><text class="dim" x="1120" y="833">password_hash</text>
    <rect x="1234" y="818" width="112" height="22" rx="6" fill="#1b2029"/><text class="dim" x="1246" y="833">refresh_token</text>
  </g>

  <line x1="1108" y1="866" x2="1540" y2="866" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="b mut" x="1108" y="894" font-size="11.5">Identifiers are validated against the</text>
  <text class="b mut" x="1108" y="912" font-size="11.5">introspected catalog. Values are always</text>
  <text class="b mut" x="1108" y="930" font-size="11.5">bound parameters — never interpolated.</text>
</svg>
